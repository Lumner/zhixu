<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" role="img" aria-labelledby="t d"><title id="t">多数表决器八段RTL稳定波形</title><desc id="d">每段十纳秒，输入从000到111，输出为00010111。该图已按真实VCD八个区间中点核对，不表示门级物理延迟。</desc><rect width="1000" height="510" rx="16" fill="#f7faf8"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203a31"><text x="25" y="37" font-size="26" font-weight="bold">八段输入，每段保持 10 ns</text><text x="25" y="68" font-size="19">预期RTL稳定值；在每段中间读值，避开切换交界。</text><path d="M180 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="180" y="99" text-anchor="middle" font-size="18">0</text><path d="M275 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="275" y="99" text-anchor="middle" font-size="18">10</text><path d="M370 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="370" y="99" text-anchor="middle" font-size="18">20</text><path d="M465 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="465" y="99" text-anchor="middle" font-size="18">30</text><path d="M560 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="560" y="99" text-anchor="middle" font-size="18">40</text><path d="M655 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="655" y="99" text-anchor="middle" font-size="18">50</text><path d="M750 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="750" y="99" text-anchor="middle" font-size="18">60</text><path d="M845 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="845" y="99" text-anchor="middle" font-size="18">70</text><path d="M940 110V420" stroke="#cddbd1" stroke-dasharray="5 5"/><text x="940" y="99" text-anchor="middle" font-size="18">80</text><text x="50" y="99" font-size="18">时间 / ns</text><text x="50" y="133" font-size="19">输入 abc</text><text x="227.5" y="133" text-anchor="middle" font-size="20">000</text><text x="322.5" y="133" text-anchor="middle" font-size="20">001</text><text x="417.5" y="133" text-anchor="middle" font-size="20">010</text><text x="512.5" y="133" text-anchor="middle" font-size="20">011</text><text x="607.5" y="133" text-anchor="middle" font-size="20">100</text><text x="702.5" y="133" text-anchor="middle" font-size="20">101</text><text x="797.5" y="133" text-anchor="middle" font-size="20">110</text><text x="892.5" y="133" text-anchor="middle" font-size="20">111</text><text x="65" y="192" font-size="25">a</text><path d="M180 205H275H370H465H560V165H655H750H845H940" fill="none" stroke="#3f7c59" stroke-width="3"/><text x="65" y="257" font-size="25">b</text><path d="M180 270H275H370V230H465H560V270H655H750V230H845H940" fill="none" stroke="#3f7c59" stroke-width="3"/><text x="65" y="322" font-size="25">c</text><path d="M180 335H275V295H370V335H465V295H560V335H655V295H750V335H845V295H940" fill="none" stroke="#3f7c59" stroke-width="3"/><text x="65" y="387" font-size="25">y</text><path d="M180 400H275H370H465V360H560V400H655V360H750H845H940" fill="none" stroke="#276da5" stroke-width="3"/><text x="25" y="463" font-size="20">测试在每段右端检查上一组，再立即加载下一组。</text><text x="25" y="492" font-size="19">例如 35 ns 看 011 / y=1；45 ns 看 100 / y=0。</text></g></svg>