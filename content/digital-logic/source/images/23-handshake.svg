<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">背压与同沿替换</title><desc id="desc">周期三四缓冲保持A1，上游B2等待。周期五交付A1并接受B2。表中接受事件由实测TRACE核对。</desc><rect width="900" height="620" rx="16" fill="#f7faf7"/><g font-family="Microsoft YaHei, sans-serif" fill="#213b30"><text x="28" y="43" font-size="27" font-weight="bold">两个 fire，分别决定两端是否完成传输</text><text x="28" y="83" font-size="21">旧项在沿上交付，新项在沿后保存；背压时两端各自保留待交项。</text><text x="35" y="145" font-size="20" font-weight="bold">周期</text><text x="135" y="145" font-size="20" font-weight="bold">沿前存项</text><text x="285" y="145" font-size="20" font-weight="bold">上游数据</text><text x="430" y="145" font-size="20" font-weight="bold">下游 ready</text><text x="565" y="145" font-size="20" font-weight="bold">in/out fire</text><text x="730" y="145" font-size="20" font-weight="bold">沿后存项</text><text x="35" y="199" font-size="23">2</text><text x="135" y="199" font-size="23">空</text><text x="285" y="199" font-size="23">A1</text><text x="430" y="199" font-size="23">0</text><text x="565" y="199" font-size="23">1/0</text><text x="730" y="199" font-size="23">A1</text><rect x="24" y="220" width="850" height="45" rx="6" fill="#e5f0e7"/><text x="35" y="251" font-size="23">3</text><text x="135" y="251" font-size="23">A1</text><text x="285" y="251" font-size="23">B2</text><text x="430" y="251" font-size="23">0</text><text x="565" y="251" font-size="23">0/0</text><text x="730" y="251" font-size="23">A1</text><rect x="24" y="272" width="850" height="45" rx="6" fill="#e5f0e7"/><text x="35" y="303" font-size="23">4</text><text x="135" y="303" font-size="23">A1</text><text x="285" y="303" font-size="23">B2</text><text x="430" y="303" font-size="23">0</text><text x="565" y="303" font-size="23">0/0</text><text x="730" y="303" font-size="23">A1</text><text x="35" y="355" font-size="23">5</text><text x="135" y="355" font-size="23">A1</text><text x="285" y="355" font-size="23">B2</text><text x="430" y="355" font-size="23">1</text><text x="565" y="355" font-size="23">1/1</text><text x="730" y="355" font-size="23">B2</text><text x="35" y="407" font-size="23">6</text><text x="135" y="407" font-size="23">B2</text><text x="285" y="407" font-size="23">C3</text><text x="430" y="407" font-size="23">1</text><text x="565" y="407" font-size="23">1/1</text><text x="730" y="407" font-size="23">C3</text><text x="35" y="459" font-size="23">7</text><text x="135" y="459" font-size="23">C3</text><text x="285" y="459" font-size="23">无效</text><text x="430" y="459" font-size="23">1</text><text x="565" y="459" font-size="23">0/1</text><text x="730" y="459" font-size="23">空</text><text x="28" y="552" font-size="22">周期 3、4：B2 没被接受，不能换；缓冲里的 A1 也不能被覆盖。</text><text x="28" y="590" font-size="20">表中 fire 已与实际仿真 TRACE 一致；数据角色按发布测试逐行解释。</text></g></svg>