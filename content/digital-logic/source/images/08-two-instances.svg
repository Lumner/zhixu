<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 570" role="img" aria-labelledby="t d"><title id="t">两个独立半加器实例</title><desc id="d">左、右两组输入分别连接u_left与u_right，两者类型均为half_adder，输出各自独立。</desc><rect width="780" height="570" rx="16" fill="#f7faf8"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#203a31"><text x="25" y="40" font-size="26" font-weight="bold">同一个模块定义，放入两份独立实例</text><text x="25" y="73" font-size="20">连接由端口指定，不由代码写在上面还是下面决定</text><rect x="245" y="110" width="260" height="150" rx="14" fill="#e2efe6" stroke="#799f87" stroke-width="2"/><text x="375" y="175" text-anchor="middle" font-size="26">half_adder</text><text x="375" y="215" text-anchor="middle" font-size="24">u_left</text><text x="25" y="152" font-size="20">a_left</text><path d="M140 145H233" stroke="#3f7c59" stroke-width="3"/><path d="M233 145l-12 -7v14z" fill="#3f7c59"/><text x="255" y="152" font-size="19">a</text><text x="492" y="152" text-anchor="end" font-size="19">sum</text><path d="M507 145H555" stroke="#3f7c59" stroke-width="3"/><path d="M555 145l-12 -7v14z" fill="#3f7c59"/><text x="570" y="152" font-size="20">sum_left</text><text x="25" y="232" font-size="20">b_left</text><path d="M140 225H233" stroke="#3f7c59" stroke-width="3"/><path d="M233 225l-12 -7v14z" fill="#3f7c59"/><text x="255" y="232" font-size="19">b</text><text x="492" y="232" text-anchor="end" font-size="19">carry</text><path d="M507 225H555" stroke="#3f7c59" stroke-width="3"/><path d="M555 225l-12 -7v14z" fill="#3f7c59"/><text x="570" y="232" font-size="20">carry_left</text><rect x="245" y="325" width="260" height="150" rx="14" fill="#e2efe6" stroke="#799f87" stroke-width="2"/><text x="375" y="390" text-anchor="middle" font-size="26">half_adder</text><text x="375" y="430" text-anchor="middle" font-size="24">u_right</text><text x="25" y="367" font-size="20">a_right</text><path d="M140 360H233" stroke="#3f7c59" stroke-width="3"/><path d="M233 360l-12 -7v14z" fill="#3f7c59"/><text x="255" y="367" font-size="19">a</text><text x="492" y="367" text-anchor="end" font-size="19">sum</text><path d="M507 360H555" stroke="#3f7c59" stroke-width="3"/><path d="M555 360l-12 -7v14z" fill="#3f7c59"/><text x="570" y="367" font-size="20">sum_right</text><text x="25" y="447" font-size="20">b_right</text><path d="M140 440H233" stroke="#3f7c59" stroke-width="3"/><path d="M233 440l-12 -7v14z" fill="#3f7c59"/><text x="255" y="447" font-size="19">b</text><text x="492" y="447" text-anchor="end" font-size="19">carry</text><path d="M507 440H555" stroke="#3f7c59" stroke-width="3"/><path d="M555 440l-12 -7v14z" fill="#3f7c59"/><text x="570" y="447" font-size="20">carry_right</text><text x="25" y="540" font-size="20">模块类型名是 half_adder；实例名是 u_left、u_right。</text></g></svg>