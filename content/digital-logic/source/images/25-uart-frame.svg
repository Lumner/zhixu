<svg xmlns="http://www.w3.org/2000/svg" width="900" height="570" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">UART十六进制53的真实符号采样</title><desc id="desc">每位四拍，时钟十纳秒，单个位时间四十纳秒。起始零、八个数据位11001010、停止一。横轴相对接受时刻，忙标志覆盖完整十格。</desc><rect width="900" height="570" rx="16" fill="#f7faf7"/><g font-family="Microsoft YaHei, sans-serif" fill="#213b30"><text x="28" y="43" font-size="27" font-weight="bold">53 的时间顺序：先发 data[0]</text><text x="28" y="82" font-size="21">实际 VCD 符号；CPB=4，每格 40 ns。横轴从接受请求算起。</text><path d="M100 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="100" y="132" font-size="18" text-anchor="middle">0</text><path d="M170 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="170" y="132" font-size="18" text-anchor="middle">40</text><path d="M240 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="240" y="132" font-size="18" text-anchor="middle">80</text><path d="M310 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="310" y="132" font-size="18" text-anchor="middle">120</text><path d="M380 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="380" y="132" font-size="18" text-anchor="middle">160</text><path d="M450 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="450" y="132" font-size="18" text-anchor="middle">200</text><path d="M520 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="520" y="132" font-size="18" text-anchor="middle">240</text><path d="M590 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="590" y="132" font-size="18" text-anchor="middle">280</text><path d="M660 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="660" y="132" font-size="18" text-anchor="middle">320</text><path d="M730 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="730" y="132" font-size="18" text-anchor="middle">360</text><path d="M800 152 V426" stroke="#cbdad0" stroke-dasharray="4 4"/><text x="800" y="132" font-size="18" text-anchor="middle">400</text><text x="135" y="179" text-anchor="middle" font-size="20">起始</text><text x="135" y="212" text-anchor="middle" font-size="22">0</text><text x="205" y="179" text-anchor="middle" font-size="20">d0</text><text x="205" y="212" text-anchor="middle" font-size="22">1</text><text x="275" y="179" text-anchor="middle" font-size="20">d1</text><text x="275" y="212" text-anchor="middle" font-size="22">1</text><text x="345" y="179" text-anchor="middle" font-size="20">d2</text><text x="345" y="212" text-anchor="middle" font-size="22">0</text><text x="415" y="179" text-anchor="middle" font-size="20">d3</text><text x="415" y="212" text-anchor="middle" font-size="22">0</text><text x="485" y="179" text-anchor="middle" font-size="20">d4</text><text x="485" y="212" text-anchor="middle" font-size="22">1</text><text x="555" y="179" text-anchor="middle" font-size="20">d5</text><text x="555" y="212" text-anchor="middle" font-size="22">0</text><text x="625" y="179" text-anchor="middle" font-size="20">d6</text><text x="625" y="212" text-anchor="middle" font-size="22">1</text><text x="695" y="179" text-anchor="middle" font-size="20">d7</text><text x="695" y="212" text-anchor="middle" font-size="22">0</text><text x="765" y="179" text-anchor="middle" font-size="20">停止</text><text x="765" y="212" text-anchor="middle" font-size="22">1</text><path d="M50 250 H100 V295 H170 V250 H240 H310 V295 H380 H450 V250 H520 V295 H590 V250 H660 V295 H730 V250 H800 H850" stroke="#527b64" stroke-width="3" fill="none"/><circle cx="135" cy="295" r="5" fill="#315f48"/><circle cx="205" cy="250" r="5" fill="#315f48"/><circle cx="275" cy="250" r="5" fill="#315f48"/><circle cx="345" cy="295" r="5" fill="#315f48"/><circle cx="415" cy="295" r="5" fill="#315f48"/><circle cx="485" cy="250" r="5" fill="#315f48"/><circle cx="555" cy="295" r="5" fill="#315f48"/><circle cx="625" cy="250" r="5" fill="#315f48"/><circle cx="695" cy="295" r="5" fill="#315f48"/><circle cx="765" cy="250" r="5" fill="#315f48"/><text x="28" y="278" font-size="21">tx</text><text x="28" y="385" font-size="21">busy</text><path d="M50 405 H100 V365 H800 V405 H850" stroke="#527b64" stroke-width="3" fill="none"/><text x="395" y="350" font-size="21">完整 10 格期间 busy=1</text><text x="28" y="470" font-size="21">圆点为位中心：20、60、100……380 ns；停止中心也必须仍忙。</text><text x="28" y="510" font-size="20">本帧实际接受时刻 35715 ns；解码结果 0x53。</text><text x="28" y="547" font-size="20">书面 01010011 按位权读；时间中的 11001010 要放回对应数据位。</text></g></svg>