<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-labelledby="title desc"><title id="title">两级流水真实采样记录</title><desc id="desc">输入先进入q1，下一个有效沿才进入q2。表格来自Icarus产生的VCD七组实际取样。</desc><rect width="840" height="650" rx="16" fill="#f7faf7"/><g font-family="Microsoft YaHei, sans-serif" fill="#213b30"><text x="28" y="45" font-size="27" font-weight="bold">q2 取得旧 q1，而不是本沿新 q1</text><text x="28" y="85" font-size="21">两级同时在 clk 上升沿采样，rst 为同步高有效复位。</text><g fill="#e5f0e7" stroke="#83a18b" stroke-width="2"><rect x="220" y="115" width="140" height="78" rx="10"/><rect x="500" y="115" width="140" height="78" rx="10"/></g><g font-size="25"><text x="60" y="164">d</text><text x="268" y="164">q1</text><text x="548" y="164">q2</text><text x="716" y="164">输出</text></g><path d="M90 155 H210 M195 147 L210 155 L195 163 M370 155 H490 M475 147 L490 155 L475 163 M650 155 H705 M690 147 L705 155 L690 163" stroke="#527b64" stroke-width="3" fill="none"/><text x="28" y="235" font-size="21">以下为真实 VCD 在各有效沿后 1 ns 的取样：</text><text x="40" y="278" font-size="22" font-weight="bold">取样 / ns</text><text x="235" y="278" font-size="22" font-weight="bold">rst</text><text x="370" y="278" font-size="22" font-weight="bold">d</text><text x="515" y="278" font-size="22" font-weight="bold">q1</text><text x="660" y="278" font-size="22" font-weight="bold">q2</text><path d="M28 330 H795" stroke="#d5e2d8"/><text x="40" y="318" font-size="23">16</text><text x="235" y="318" font-size="23">1</text><text x="370" y="318" font-size="23">0</text><text x="515" y="318" font-size="23">0</text><text x="660" y="318" font-size="23">0</text><path d="M28 367 H795" stroke="#d5e2d8"/><text x="40" y="355" font-size="23">26</text><text x="235" y="355" font-size="23">0</text><text x="370" y="355" font-size="23">A</text><text x="515" y="355" font-size="23">A</text><text x="660" y="355" font-size="23">0</text><path d="M28 404 H795" stroke="#d5e2d8"/><text x="40" y="392" font-size="23">36</text><text x="235" y="392" font-size="23">0</text><text x="370" y="392" font-size="23">B</text><text x="515" y="392" font-size="23">B</text><text x="660" y="392" font-size="23">A</text><path d="M28 441 H795" stroke="#d5e2d8"/><text x="40" y="429" font-size="23">46</text><text x="235" y="429" font-size="23">0</text><text x="370" y="429" font-size="23">C</text><text x="515" y="429" font-size="23">C</text><text x="660" y="429" font-size="23">B</text><path d="M28 478 H795" stroke="#d5e2d8"/><text x="40" y="466" font-size="23">56</text><text x="235" y="466" font-size="23">1</text><text x="370" y="466" font-size="23">F</text><text x="515" y="466" font-size="23">0</text><text x="660" y="466" font-size="23">0</text><path d="M28 515 H795" stroke="#d5e2d8"/><text x="40" y="503" font-size="23">66</text><text x="235" y="503" font-size="23">0</text><text x="370" y="503" font-size="23">F</text><text x="515" y="503" font-size="23">F</text><text x="660" y="503" font-size="23">0</text><path d="M28 552 H795" stroke="#d5e2d8"/><text x="40" y="540" font-size="23">76</text><text x="235" y="540" font-size="23">0</text><text x="370" y="540" font-size="23">2</text><text x="515" y="540" font-size="23">2</text><text x="660" y="540" font-size="23">F</text><text x="28" y="612" font-size="21">例如 26 ns 的 A 先到 q1，36 ns 才在 q2 读到 A。</text></g></svg>